[package]
name = "stable_digest"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Stable, dependency-light, no_std SHA-256 content digest rendered as lowercase hex."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/stable_digest"
readme = "README.md"
keywords = ["digest", "sha256", "no-std", "content-addressing"]
categories = ["cryptography", "no-std"]

[features]
default = ["std"]
std = ["sha2/std"]

[dependencies]
sha2 = { version = "0.10.8", default-features = false }

[lib]
name = "stable_digest"
path = "src/lib.rs"
